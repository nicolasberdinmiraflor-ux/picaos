/* ---- fondo animado ---- */
body{--g1:#5b3fb0;--g2:#ffcf3f33}

  h+=C?`<h2>📱 Pásale el móvil a ${who_(k)}</h2><button id="peek" class="pri" style="padding:22px;font-size:1.2em;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none">👁 ${esc(M[k].n)}: mantén pulsado para ver tu palabra</button><div id="peekw" class="big" style="visibility:hidden;font-size:clamp(1.6rem,8vw,3rem)">${mi.has(k)?"🕵️ ERES EL IMPOSTOR":esc(cap(it.q))}</div><button style="padding:16px" data-a="ppNext">✓ Ya la he visto → siguiente</button>`:`<h2>📱 Pasándose el móvil</h2><p>Ahora mira su palabra ${who_(k)}</p>`;
  h+=`<p class="muted">${(st.ri||0)+1} de ${M.length} · Hay ${ni} impostor${ni>1?"es":""}</p>`}
 else if(st.sub==="talk"){const cur=o[(st.oi||0)%o.length];

 else{const vi=st.vi||0,k=o[vi];
  h+=C?`<h2>🗳 Pásale el móvil a ${who_(k)} para que vote</h2><p class="muted">${esc(M[k].n)}, ¿quién es el impostor?</p><div class="row" style="justify-content:center">${M.map((x,j)=>j===k?"":`<button style="flex:1 1 40%" data-a="ppPick" data-v="${j}">${esc(x.n)}</button>`).join("")}</div>`:`<h2>🗳 Votando: ${who_(k)}</h2>`;
  h+=`<p class="muted">Voto ${vi+1} de ${M.length}</p>`}
 return h+`</div>`+(tv?score(true):"")}
function impV(st,tv,it,hd){if(st.M)return impPassV(st,tv,it,hd);const P=room.players,im=!tv&&(st.imp||{})[me.uid],C=!tv&&amCtrl(),ni=Object.keys(st.imp||{}).length,o=(st.ord||[]).filter(u=>P[u]),oi=st.oi||0,cur=o.length?o[oi%o.length]:"",vu=o.length?Math.floor(oi/o.length)+1:1;
 let h=`<div class="box center">${hd}`;
 if(st.sub==="talk"){
  if(!tv)h+=`<button id="peek" class="pri" style="padding:22px;font-size:1.2em;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none">👁 Mantén pulsado para ver tu palabra</button><div id="peekw" class="big" style="visibility:hidden;font-size:clamp(1.6rem,8vw,3rem)">${im?"🕵️ ERES EL IMPOSTOR":esc(cap(it.q))}</div>`;

  if(!tv&&(cur===me.uid||C))h+=`<button style="padding:16px" data-a="impNext">Siguiente ▶</button>`;
  if(C)h+=`<button class="pri" data-a="toVote">Todos de acuerdo: ¡a votar!</button>`}
 else{const rid=RID(st);h+=`<h2>¡A votar! ¿Quién es el impostor?</h2><div class="stage">${CLK}</div>`;
  if(!tv)h+=myFb===rid+"s"?`<p style="color:var(--ok)">✓ Has votado a <b>${esc(myAns)}</b></p>`:`<div class="row" style="justify-content:center">${ps().filter(p=>p.u!==me.uid).map(p=>`<button style="flex:1 1 40%" data-a="vote" data-v="${p.u}">${esc(p.n)}</button>`).join("")}</div>`}
 return h+`</div>`+(tv?score(true):"")}
function tabuV(st,tv,it,hd){const P=room.players,mp=P[me.uid],nm=P[st.sg]?.n||"?",D=!tv&&st.sg===me.uid,rival=!tv&&team()&&mp&&mp.t>=0&&mp.t!==st.stm,see=D||rival;
 let h=`<div class="box center">${hd}<div>Describe <b>${esc(nm)}</b> ${team()?tdot(st.stm):""}</div>`;
 h+=see?`<div class="stage"><div class="big">${esc(cap(it.q))}</div>${CLK}</div><div><span class="muted">Prohibidas:</span> ${it.tb.map(w=>`<b style="color:var(--bad)">${esc(w)}</b>`).join(" · ")}</div>`:`<div class="stage"><div class="big">?</div>${CLK}</div><p>¡Adivina${tv?"d":""} la palabra!</p>`;
 if(D)h+=team()?`<div class="row" style="justify-content:center"><button class="ok" style="flex:1;padding:16px" data-a="tbOk">✓ Acertada</button><button style="flex:1;padding:16px" data-a="tbNo" data-v="pasa">Pasar</button></div>`:`<p class="muted">¿Quién la ha acertado?</p><div class="row" style="justify-content:center">${ps().filter(p=>p.u!==me.uid).map(p=>`<button class="ok" style="flex:1 1 40%" data-a="tbOk" data-v="${p.u}">${esc(p.n)}</button>`).join("")}</div><button data-a="tbNo" data-v="pasa">Pasar</button>`;
 if(rival)h+=`<button class="bad" style="padding:16px" data-a="tbNo" data-v="tabu">🚫 ¡Tabú!</button>`;
 return h+`</div>`+(tv?score(true):"")}
function qsV(st,tv,it,hd){const P=room.players,nm=P[st.sg]?.n||"?",Gs=!tv&&st.sg===me.uid,C=!tv&&amCtrl(),rid=st.gi+"_"+st.r;
 let h=`<div class="box center">${hd}<div>Adivina <b>${esc(nm)}</b> ${team()?tdot(st.stm):""}</div>`;
 if(Gs&&qsShown!==rid)h+=`<div class="stage"><div class="big">?</div>${CLK}</div><p>📱 Ponte el móvil en la frente, mirando hacia los demás, y pulsa:</p><button class="pri" style="padding:20px;font-size:1.2em" data-a="qsShow">Ya lo tengo en la frente</button>`;
 else{h+=`<div class="stage"><div class="big"${Gs?' style="font-size:clamp(2.6rem,14vw,5rem)"':""}>${esc(cap(it.q))}</div>${CLK}</div>`;
  h+=Gs?"":tv?`<p><b>${esc(nm)}</b>, ¡no mires la tele!</p>`:`<p>Dale pistas a <b>${esc(nm)}</b> sin decir la palabra.</p>`;
  if(Gs||C)h+=`<div class="row" style="justify-content:center"><button class="ok" style="flex:1;padding:18px" data-a="qsOk">✓ Acierto</button><button style="flex:1;padding:18px" data-a="tbNo" data-v="pasa">Paso</button></div>`}
 return h+`</div>`+(tv?score(true):"")}
function cantaV(st,tv,it,hd){const nm=st.sg?(room.players[st.sg]?.n||"?"):"Equipo "+tname(st.stm),mp=room.players[me.uid],mine=!tv&&(st.sg?st.sg===me.uid:mp&&mp.t===st.stm),C=!tv&&amCtrl();
 const m={think:"¡Memoriza la palabra!",wait:"¿Preparado?",sing:"¡A cantar!",judge:"¡Tiempo! ¿La ha cantado?",fail:"No la ha cantado"}[st.sub]||"";
 let h=`<div class="box center">${hd}<div>Turno de <b>${esc(nm)}</b> ${team()?tdot(st.stm):""}</div><span class="muted">${it.l==="en"?"INGLÉS":"ESPAÑOL"}</span><div class="stage"><div class="big">${st.sub==="think"?esc(cap(it.q)):"?"}</div>${CLK}</div><p><b>${m}</b></p>`;
 if(st.sub==="wait"&&(mine||C))h+=`<button class="pri" data-a="cStart">¡Empezar a cantar!</button>`;
 if(C&&st.sub!=="think"){const q=encodeURIComponent(it.q);
  h+=`<div class="muted">Palabra: <b>${esc(it.q)}</b> · Comprobar: <a target="_blank" rel="noopener" href="https://open.spotify.com/search/${q}">Spotify</a> · <a target="_blank" rel="noopener" href="https://www.musixmatch.com/search?query=${q}">Musixmatch</a> · <a target="_blank" rel="noopener" href="https://genius.com/search?q=${q}">Genius</a></div>`;
  if(st.sub==="sing"||st.sub==="judge")h+=`<div class="row" style="justify-content:center"><button class="ok" data-a="cOk">¡La ha cantado! +1</button><button class="bad" data-a="cFail">No la ha cantado</button></div>`;
  if(st.sub==="fail")h+=`<div class="row" style="justify-content:center"><button data-a="cReb">Rebote: misma palabra al siguiente</button><button class="pri" data-a="cNext">Siguiente palabra</button></div>`}
 return h+`</div>`+(tv?score(true):"")}
function revealV(st){if(st.g==="impostor"&&st.sub==="miss"){const C=role!=="tv"&&amCtrl();return `<div class="box center"><div class="muted">El impostor · Ronda ${st.r+1}/${NR()}</div><div class="big">🤫</div><p style="font-size:1.1em">${st.res||""}</p>${C?`<button class="pri" data-a="impAgain">🔁 Otra ronda con la misma palabra</button><button data-a="impRev">Revelar: ganan los impostores</button>`:`<p class="muted">El anfitrión decide si hay otra ronda…</p>`}</div>`+score(true)}const g=GAMES[st.g]||{},it=item(st.g,st.p,st.r),w=st.win;let r="Nadie ha acertado";
 if(w){const x=[];if(w.u)x.push(esc(w.n));if(team()&&w.t>=0)x.push("Equipo "+tname(w.t));r="¡Punto para "+x.join(" · ")+"!"}
 return `<div class="box center"><div class="muted">${g.n} · Ronda ${st.r+1}/${NR()}</div><div>${g.k==="chain"?"Palabra inicial":["turn","imp","tabu","qs","pic"].includes(g.k)?"Palabra":st.g==="colmena"?"Tema":"Respuesta"}</div><div class="big"${st.g==="colmena"?' style="font-size:clamp(1.3rem,6vw,2.4rem)"':""}>${esc(st.g==="colmena"?it.q:cap(String(it.a).split("|").slice(0,3).join(", ")))}</div>${st.g==="pictionary"?'<div id="cvslot" style="width:100%;max-width:380px;margin:auto"></div>':""}${st.res?`<p style="font-size:1.1em">${st.res}</p>`:`<h2>${r}</h2>`}<div class="stage">${CLK}</div></div>`+score(true)}
function gendV(st,tv){return `<div class="box center"><h2>Fin de ${GAMES[st.g]?.n||"juego"}</h2><p>🏅 Gana: <b>${esc((st.hist||{})[st.g]||"")}</b></p><div class="stage">${CLK}</div>${!tv&&amCtrl()?`<button class="pri" data-a="revancha">🔁 Revancha: repetir este juego</button>`:""}</div>`+score(false)}
function podium(){const sc=room.sc||{},T=team();let l;
 if(T){const s=room.sct||{};l=[...Array(room.cfg.teams).keys()].map(t=>({n:"Equipo "+tname(t),c:TEAMS[t][1],p:fmt(s[t])}))}else l=ps().map(p=>({n:(p.e||"")+" "+p.n,c:"var(--accent)",p:sc[p.u]||0}));
 l.sort((a,b)=>b.p-a.p);const o=[l[1],l[0],l[2]],H=[110,160,80],M=["🥈","🥇","🥉"];
 return `<div class="pod">${o.map((x,k)=>x?`<div><div class="nm" style="animation-delay:${[.6,1,.3][k]}s">${M[k]}<br>${esc(x.n)}</div><div class="bar" style="height:${H[k]}px;background:${x.c};animation-delay:${[.3,.6,0][k]}s">${x.p}</div></div>`:"<div></div>").join("")}</div>`}
function confetti(){const C=["#ffcf3f","#ff5d73","#4da3ff","#3fdc8f","#a855f7","#fb923c"];let h="";for(let k=0;k<70;k++)h+=`<i style="left:${Math.random()*100}%;background:${C[k%6]};animation-duration:${3+Math.random()*4}s;animation-delay:${-Math.random()*6}s"></i>`;return `<div class="conf" aria-hidden="true">${h}</div>`}
function endV(st,tv){const hs=st.hist||{};return confetti()+`<h1>🏆 ¡Fin de la sesión!</h1><div class="box">${podium()}</div>`+(Object.keys(hs).length?`<div class="box"><h2>Resumen</h2><ul class="list">${Object.keys(hs).map(g=>`<li><span class="n">${GAMES[g]?.n||g}</span><b>${esc(hs[g])}</b></li>`).join("")}</ul></div>`:"")+score(false)+(tv?"":isHost()?`<button class="pri" data-a="again">Jugar otra sesión</button><button data-a="close">Cerrar sala</button>`:`<button data-a="out">Salir de la sala</button>`)}
function score(c){const sc=room.sc||{},T=team(),l=ps().sort((a,b)=>(sc[b.u]||0)-(sc[a.u]||0));let h=`<div class="box"><h2>Marcador</h2>`;
 if(T){const s=room.sct||{},ts=[...Array(room.cfg.teams).keys()].sort((a,b)=>(s[b]||0)-(s[a]||0));
  h+=`<ul class="list">${ts.map(t=>`<li data-k="t${t}">${tdot(t)}<span class="n">Equipo ${tname(t)}${c?"":`<br><small class="muted">${ps().filter(p=>p.t===t).map(p=>(p.e||"")+esc(p.n)+" "+(sc[p.u]||0)).join(" · ")}</small>`}</span><span class="p" data-c="t${t}" data-v="${fmt(s[t])}">${fmt(s[t])}</span></li>`).join("")}</ul>`;
  if(!c&&l.length&&(sc[l[0].u]||0)>0)h+=`<div class="muted">⭐ MVP: ${l[0].e||""} ${esc(l[0].n)} (${sc[l[0].u]})</div>`}
 else h+=`<ul class="list">${(c?l.slice(0,5):l).map((p,i)=>`<li data-k="p${p.u}"><span class="n">${i+1}. ${p.e||""} ${esc(p.n)}</span><span class="p" data-c="p${p.u}" data-v="${sc[p.u]||0}">${sc[p.u]||0}</span></li>`).join("")}</ul>`;
 return h+`</div>`}

 return `<div class="ctrl">${st.end||st.pz||st.sub==="judge"?b("pause",st.pz?"▶ Reanudar":"⏸ Pausa")+b("restart","↺ Reiniciar tiempo"):""}${st.ph==="round"?b("skipR","⏭ Saltar ronda"):""}${["intro","round","reveal"].includes(st.ph)?b("skipG","⏩ Terminar juego"):""}${b("endS","■ Fin","bad")}</div>`}
