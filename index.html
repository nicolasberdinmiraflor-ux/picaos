 if(GAMES[g].k==="speed")Object.assign(o,{end:t+secs(g)*1000,tot:secs(g)*1000,sub:null});
 else{const tk=(st.tk??-1)+1;Object.assign(o,singer(tk),{tk,sub:"think",end:t+THINK,tot:THINK})}

 document.querySelectorAll(".clk").forEach(el=>{if(rem==null){el.hidden=true;return}el.hidden=false;const s=Math.max(0,Math.ceil(rem/1000));el.querySelector("b").textContent=st.pz?"⏸":s;el.style.setProperty("--p",Math.max(0,Math.min(1,rem/(st.tot||1))));el.classList.toggle("low",s<=5&&!st.pz)})}

 if(role!=="tv"&&!room.players[me.uid])return leave("Ya no estás en la sala.");
 const a=$("#ans"),av=a?a.value:"",af=a&&document.activeElement===a,st=room.st,tv=role==="tv";
